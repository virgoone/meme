name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check web types
        run: bun run check-types:web

      - name: Check server types
        run: bun run check-types:server

      - name: Check editor types
        run: bun run check-types:editor

      - name: Run regression tests
        run: bash scripts/test-ci.sh

      - name: Build web
        run: bun run build:web

      - name: Build server
        run: bun run build:server
