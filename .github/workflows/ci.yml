name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check web types
        run: bun run check-types:web

      - name: Check server types
        run: bun run check-types:server

      - name: Check editor types
        run: bun run check-types:editor

      - name: Run tests
        run: bun test packages/editor/src/block-id.test.ts packages/db/src/migration/sanity-content.test.ts apps/server/src/modules/projects/index.test.ts apps/server/src/modules/reactions/service.test.ts apps/server/src/cloudflare/public-routes.test.ts

      - name: Test loading states
        run: bun test apps/web/tests/loading.test.tsx apps/web/tests/format.test.ts

      - name: Test article creation and draft access
        run: bun test apps/server/src/modules/posts/index.test.ts apps/server/src/modules/system/views.test.ts apps/web/tests/slate-post-block.test.tsx

      - name: Build web
        run: bun run build:web

      - name: Build server
        run: bun run build:server
