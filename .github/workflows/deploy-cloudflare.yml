name: Cloudflare Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:migration

      - name: Check server types
        run: bun run check-types:server

      - name: Check web types
        run: bun run check-types:web

      - name: Check editor types
        run: bun run check-types:editor

      - name: Test migration invariants
        run: bun test packages/editor/src/block-id.test.ts packages/db/src/migration/sanity-content.test.ts apps/server/src/modules/projects/index.test.ts apps/server/src/modules/reactions/service.test.ts

      - name: Build Cloudflare web app
        run: bun run build:web

      - name: Build Cloudflare server
        run: bun run build:server

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && vars.CF_DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build target web app
        run: bun run build:web

      - name: Build target server
        run: bun run build:server

      - name: Deploy
        run: bun run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
