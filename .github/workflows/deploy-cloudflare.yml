name: Cloudflare Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a Worker upload midway through a production release.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check server types
        run: bun run check-types:server

      - name: Check web types
        run: bun run check-types:web

      - name: Check editor types
        run: bun run check-types:editor

      - name: Run regression tests
        run: bash scripts/test-ci.sh

      - name: Build Cloudflare web app
        run: bun run build:web

      - name: Build Cloudflare server
        run: bun run build:server

      - name: Save verified web build
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-web-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    # Deploy by default; an explicit false is an emergency pause switch.
    if: github.ref == 'refs/heads/main' && vars.CF_DEPLOY_ENABLED != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See docs/production-release.md."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore verified web build
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-web-${{ github.sha }}
          path: apps/web/dist

      - name: Deploy
        run: bun run cf:deploy --keep-vars --message "GitHub main ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check Worker and public site
        run: bun scripts/check-production.mjs

      - name: Record release
        run: |
          printf 'Deployed `%s` to Worker `meme`.\n\n[Open blog](https://blog.douni.one/)\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
